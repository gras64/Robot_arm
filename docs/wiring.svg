<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <style>
    .box { fill:#f3f4f6; stroke:#111827; stroke-width:1.5 } 
    .title { font: bold 14px sans-serif; fill:#0f172a }
    .lbl { font: 12px sans-serif; fill:#111827 }
    .line { stroke:#0f172a; stroke-width:2 }
    .bus { stroke:#b91c1c; stroke-width:4 }
    .gnd { stroke:#0f172a; stroke-dasharray:4 4 }
  </style>

  <!-- ESP32 -->
  <rect x="20" y="40" width="180" height="120" class="box" rx="6"/>
  <text x="30" y="62" class="title">ESP32</text>
  <text x="30" y="86" class="lbl">MOSI (GPIO 23)</text>
  <text x="30" y="104" class="lbl">MISO (GPIO 19)</text>
  <text x="30" y="122" class="lbl">SCK  (GPIO 18)</text>
  <text x="30" y="140" class="lbl">CS   (GPIO 10)</text>
  <text x="30" y="158" class="lbl">INT  (GPIO 2)</text>

  <!-- MCP2515 -->
  <rect x="260" y="20" width="200" height="160" class="box" rx="6"/>
  <text x="270" y="42" class="title">MCP2515 (CAN Controller)</text>
  <text x="270" y="66" class="lbl">MOSI</text>
  <text x="270" y="86" class="lbl">MISO</text>
  <text x="270" y="108" class="lbl">SCK</text>
  <text x="270" y="130" class="lbl">CS</text>
  <text x="270" y="150" class="lbl">INT</text>

  <!-- SPI connections -->
  <line x1="200" y1="86" x2="260" y2="66" class="line" /> <!-- MOSI -->
  <text x="210" y="74" class="lbl">MOSI</text>
  <line x1="200" y1="104" x2="260" y2="86" class="line" /> <!-- MISO -->
  <text x="210" y="96" class="lbl">MISO</text>
  <line x1="200" y1="122" x2="260" y2="106" class="line" /> <!-- SCK -->
  <text x="210" y="112" class="lbl">SCK</text>
  <line x1="200" y1="140" x2="260" y2="130" class="line" /> <!-- CS -->
  <text x="210" y="130" class="lbl">CS (GPIO10)</text>
  <line x1="200" y1="158" x2="260" y2="150" class="line" /> <!-- INT -->
  <text x="210" y="150" class="lbl">INT (GPIO2)</text>

  <!-- CAN transceiver area label -->
  <rect x="260" y="200" width="200" height="120" class="box" rx="6"/>
  <text x="270" y="222" class="title">CAN Transceiver / MCP2551</text>
  <text x="270" y="244" class="lbl">CAN_TX / CAN_RX</text>

  <!-- CAN bus line to MKS servos -->
  <line x1="460" y1="260" x2="780" y2="260" class="bus" />
  <text x="520" y="248" class="lbl">CAN_H / CAN_L (Twisted Pair)</text>

  <!-- MKS SERVO42D devices -->
  <g>
    <rect x="640" y="40" width="220" height="60" class="box" rx="6"/>
    <text x="650" y="62" class="title">MKS SERVO42D (x6)</text>
    <text x="650" y="82" class="lbl">CAN_H / CAN_L -> Bus</text>
  </g>

  <!-- power and ground connections -->
  <line x1="120" y1="200" x2="120" y2="260" class="line" />
  <text x="80" y="232" class="lbl">3.3V / 5V (check module)</text>
  <line x1="120" y1="260" x2="460" y2="260" class="gnd"/>
  <text x="320" y="278" class="lbl">GND (common)</text>

  <!-- Legend -->
  <rect x="20" y="240" width="220" height="100" fill="#fff" stroke="#ccc"/>
  <text x="30" y="260" class="lbl">Legende:</text>
  <text x="30" y="278" class="lbl">• Dicke rote Leitung: CAN Bus (CAN_H/CAN_L)</text>
  <text x="30" y="296" class="lbl">• Dünne Linien: SPI / Signale</text>
  <text x="30" y="314" class="lbl">• GND: gemeinsamer Masseanschluss</text>

</svg>
