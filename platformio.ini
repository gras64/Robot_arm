; PlatformIO project configuration for ESP32 WROOM-1
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Uncomment and set your serial port if required, e.g. /dev/ttyUSB0
upload_port = /dev/ttyACM0

; If you need specific libraries, add them here, e.g.: lib_deps = mcp_can
; Bibliotheken, die automatisch installiert werden sollen
lib_deps =
	# Use the GitHub URL so PlatformIO clones the library directly
	https://github.com/coryjfowler/MCP_CAN_lib.git
	# Micro-ROS Arduino client (optional features for micro-ROS)
	https://github.com/micro-ROS/micro_ros_arduino.git
	# MQTT and JSON for backend integration
	knolleary/PubSubClient@^2.8
	bblanchon/ArduinoJson@^6.18.5
